name: Publish scheduled releases

# Releases go out only when the owner says so (23/10). Run by hand to publish a draft whose date in
# schedule.json has come; a one-off time can be added under schedule (owner 28/10: 0.8.7 at 11:00).
on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC = 11:00 Việt Nam, 28/10 only (remove after it ran).
    - cron: "0 4 28 10 *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due drafts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today=$(TZ=Asia/Ho_Chi_Minh date +%F)
          drafts=$(gh release list --repo "$REPO" --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName')
          # Oldest first, so the newest due release ends up "latest".
          for tag in $(python3 -c 'import json; d=json.load(open("schedule.json")); print(" ".join(sorted((k for k in d if k.startswith("v")), key=lambda k: [int(x) for x in k[1:].split(".")])))'); do
            due=$(python3 -c "import json; print(json.load(open('schedule.json'))['$tag'])")
            if [ "$due" \> "$today" ]; then echo "$tag: chờ tới $due"; continue; fi
            if echo "$drafts" | grep -qx "$tag"; then
              gh release edit "$tag" --repo "$REPO" --draft=false --latest && echo "$tag: đã đăng"
            else
              echo "$tag: không có bản nháp (đã đăng hoặc đã xoá)"
            fi
          done
